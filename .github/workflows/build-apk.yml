name: Build Lix APK
# Stable workflow based on the known-good APK build, with only the focused Godot surface included.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: lix-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'
      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
      - name: Prepare focused Godot source tree
        run: |
          set -euxo pipefail
          rm -rf build-app
          cp -a llama.cpp/examples/llama.android/. build-app/
          cp lix/MainActivity.kt build-app/app/src/main/java/com/example/llama/MainActivity.kt
          for f in LixAutomation.kt LixProjectManager.kt LixGodotAgent.kt LixGodotWorkspace.kt LixGodotAssetRuntime.kt LixImageTo3D.kt LixBackgroundStore.kt LixBackgroundWorker.kt; do cp "lix/$f" "build-app/app/src/main/java/com/example/llama/$f"; done
          mkdir -p build-app/app/src/main/res/xml build-app/app/src/main/assets/models build-app/app/src/main/res/drawable
          python3 lix/focused_godot_ui_patch.py
          sed -i 's/\.toDrawable()//g' build-app/app/src/main/java/com/example/llama/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-app/app/build.gradle.kts')
          s = p.read_text()
          deps = [
              '    implementation("com.google.mlkit:text-recognition:16.0.1")',
              '    implementation("com.google.mlkit:image-labeling:17.0.9")',
              '    implementation("androidx.work:work-runtime-ktx:2.12.0")'
          ]
          missing = [d for d in deps if d not in s]
          if missing:
              s = s.replace('dependencies {', 'dependencies {\n' + '\n'.join(missing), 1)
              p.write_text(s)
          PY
          sed -i 's#^set(LLAMA_SRC.*#set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp)#' build-app/lib/src/main/cpp/CMakeLists.txt
          sed -i '/minSdk = 33/a\        ndk { abiFilters += listOf("armeabi-v7a") }' build-app/app/build.gradle.kts
          sed -i '/abiFilters += listOf/c\             abiFilters += listOf("armeabi-v7a")' build-app/lib/build.gradle.kts
          sed -i 's/-DGGML_CPU_ALL_VARIANTS=ON/-DGGML_CPU_ALL_VARIANTS=OFF/' build-app/lib/build.gradle.kts
          sed -i 's/constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;/constexpr int   DEFAULT_CONTEXT_SIZE    = 2048;/' build-app/lib/src/main/cpp/ai_chat.cpp
          sed -i 's/constexpr int   BATCH_SIZE              = 512;/constexpr int   BATCH_SIZE              = 256;/' build-app/lib/src/main/cpp/ai_chat.cpp
          python3 lix/optimization_patch.py
          python3 lix/patch_android_abi.py
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.lix.ai"/' build-app/app/build.gradle.kts
          cp lix/AndroidManifest.xml build-app/app/src/main/AndroidManifest.xml
          sed -i '/defaultConfig {/a\        versionCode = ${{ github.run_number }}\n        versionName = "2.0.${{ github.run_number }}"' build-app/app/build.gradle.kts
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert lix/lix_icon.svg -resize 512x512 build-app/app/src/main/res/drawable/lix_icon.png
      - name: Download Qwen3
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf 'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true'
          test -s build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf
          ls -lh build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf
      - name: Verify focused feature wiring and model path
        run: |
          set -euxo pipefail
          EXPECTED='lix-qwen3-1.7b-q4_k_m.gguf'
          test -f "build-app/app/src/main/assets/models/$EXPECTED"
          test -f build-app/app/src/main/java/com/example/llama/LixImageTo3D.kt
          test -f build-app/app/src/main/java/com/example/llama/LixGodotAgent.kt
          test -f build-app/app/src/main/java/com/example/llama/LixGodotWorkspace.kt
          test -f build-app/app/src/main/java/com/example/llama/LixGodotAssetRuntime.kt
          test -f build-app/app/src/main/java/com/example/llama/LixBackgroundWorker.kt
          grep -F 'Lix · Godot' build-app/app/src/main/java/com/example/llama/MainActivity.kt
          grep -F 'LixImageTo3D.start' build-app/app/src/main/java/com/example/llama/MainActivity.kt
          if grep -R -n -F 'lix-qwen3-0.6b-q4_0.gguf' build-app/app/src/main lix --exclude-dir=.git; then exit 1; fi
      - name: Build
        working-directory: build-app
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Verify packaged model and focused modules
        run: |
          set -euxo pipefail
          APK=$(find build-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -F 'assets/models/lix-qwen3-1.7b-q4_k_m.gguf'
          if unzip -l "$APK" | grep -F 'lix-qwen3-0.6b-q4_0.gguf'; then exit 1; fi
      - name: Prepare APK artifact
        run: |
          set -euxo pipefail
          mkdir -p build-app/dist
          APK=$(find build-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" build-app/dist/Lix.apk
          ls -lh build-app/dist/Lix.apk
      - name: Verify final APK size and integrity
        run: |
          APK=build-app/dist/Lix.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Deep verify APK for Android installer
        run: |
          APK=build-app/dist/Lix.apk
          file "$APK"
          unzip -t "$APK" >/tmp/lix_unzip_test.txt
          tail -n 3 /tmp/lix_unzip_test.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 25
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          stat -c '%s' "$APK"
      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: Lix-APK-Godot-${{ github.run_number }}
          path: build-app/dist/Lix.apk
          if-no-files-found: error
          compression-level: 0
