name: Build Lix APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Prepare llama.cpp source tree
        run: |
          rm -rf build-app
          cp -a llama.cpp/examples/llama.android/. build-app/
          cp lix/MainActivity.kt build-app/app/src/main/java/com/example/llama/MainActivity.kt
          sed -i 's#^set(LLAMA_SRC.*#set(LLAMA_SRC \${CMAKE_CURRENT_LIST_DIR}/../../../../../../llama.cpp)#' build-app/lib/src/main/cpp/CMakeLists.txt
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.lix.ai"/' build-app/app/build.gradle.kts
          sed -i 's/namespace = "com.example.llama"/namespace = "com.example.llama"/' build-app/app/build.gradle.kts
          mkdir -p build-app/app/src/main/assets/models

      - name: Download Qwen3
        run: |
          curl -L --fail --retry 5 \
            -o build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf \
            'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true'
          ls -lh build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf

      - name: Build
        working-directory: build-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lix-APK
          path: build-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
