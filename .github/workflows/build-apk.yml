name: Build Lix APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'

      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Prepare llama.cpp source tree
        run: |
          set -euxo pipefail
          rm -rf build-app
          cp -a llama.cpp/examples/llama.android/. build-app
          cp lix/MainActivity.kt build-app/app/src/main/java/com/example/llama/MainActivity.kt
          sed -i 's/\.toDrawable()//g' build-app/app/src/main/java/com/example/llama/MainActivity.kt
          for f in LixAutomation.kt LixAccessibilityService.kt LixWakeService.kt LixTaskService.kt LixVoiceInteractionService.kt LixVoiceSessionService.kt LixProjectManager.kt LixEvolution.kt LixVisualCreator.kt LixFeatureHub.kt LixFeatureRuntime.kt LixMegaModules.kt LixStage1Core.kt LixCapabilityStore.kt LixGodotAgent.kt; do cp "lix/$f" "build-app/app/src/main/java/com/example/llama/$f"; done
          cp lix/evolution_catalog.json build-app/app/src/main/java/com/example/llama/evolution_catalog.json
          mkdir -p build-app/app/src/main/res/xml build-app/app/src/main/assets/models build-app/app/src/main/res/drawable
          cp lix/accessibility_service_config.xml build-app/app/src/main/res/xml/accessibility_service_config.xml
          cp lix/voice_interaction_service.xml build-app/app/src/main/res/xml/voice_interaction_service.xml
          python3 lix/apply_glass_ui.py
          python3 lix/mega_features_patch.py
          python3 lix/integrate_godot_agent.py
          python3 lix/prepare_build.py
          sed -i 's#^set(LLAMA_SRC.*#set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp)#' build-app/lib/src/main/cpp/CMakeLists.txt
          sed -i 's/constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;/constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;/' build-app/lib/src/main/cpp/ai_chat.cpp
          sed -i 's/constexpr int   BATCH_SIZE              = 512;/constexpr int   BATCH_SIZE              = 256;/' build-app/lib/src/main/cpp/ai_chat.cpp
          cp lix/AndroidManifest.xml build-app/app/src/main/AndroidManifest.xml
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert lix/lix_icon.svg -resize 512x512 build-app/app/src/main/res/drawable/lix_icon.png
          echo '=== FINAL ABI CONFIG ==='
          grep -n 'abiFilters\|GGML_CPU_ALL_VARIANTS' build-app/app/build.gradle.kts build-app/lib/build.gradle.kts || true

      - name: Download Qwen3 Godot
        run: |
          curl -L --fail --retry 5 -o build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf 'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true'
          ls -lh build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf

      - name: Build
        working-directory: build-app
        env:
          ANDROID_ABI: arm64-v8a
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/lix-gradle.log

      - name: Prepare APK artifact
        if: always()
        run: |
          set -euxo pipefail
          rm -rf build-app/dist
          mkdir -p build-app/dist
          APK="build-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            APK=$(find build-app/app/build/outputs -type f -name '*.apk' | head -n 1 || true)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo 'APK not found in app/build/outputs'
            find build-app -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK" build-app/dist/Lix.apk
          test -s build-app/dist/Lix.apk
          sha256sum build-app/dist/Lix.apk
          ls -lh build-app/dist/Lix.apk

      - name: Verify final APK size and integrity
        if: success()
        run: |
          APK=build-app/dist/Lix.apk
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Deep verify APK for Android installer
        if: success()
        run: |
          APK=build-app/dist/Lix.apk
          test -f "$APK"
          file "$APK"
          unzip -t "$APK" >/tmp/lix_unzip_test.txt
          tail -n 3 /tmp/lix_unzip_test.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 25
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.(so)$' | head -n 40 || true
          stat -c '%s' "$APK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lix-debug-${{ github.run_number }}
          path: /tmp/lix-gradle.log
          if-no-files-found: warn
          compression-level: 0

      - name: Upload complete APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lix-APK-POCO-C65-Godot-${{ github.run_number }}
          path: build-app/dist/Lix.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
