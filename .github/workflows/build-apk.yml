name: Build Lix APK
# Stable build workflow

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'
      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
      - name: Prepare llama.cpp source tree
        run: |
          rm -rf build-app
          cp -a llama.cpp/examples/llama.android/. build-app/
          cp lix/MainActivity.kt build-app/app/src/main/java/com/example/llama/MainActivity.kt
          cp lix/LixAutomation.kt build-app/app/src/main/java/com/example/llama/LixAutomation.kt
          cp lix/LixAccessibilityService.kt build-app/app/src/main/java/com/example/llama/LixAccessibilityService.kt
          cp lix/LixWakeService.kt build-app/app/src/main/java/com/example/llama/LixWakeService.kt
          cp lix/LixTaskService.kt build-app/app/src/main/java/com/example/llama/LixTaskService.kt
          cp lix/LixVoiceInteractionService.kt build-app/app/src/main/java/com/example/llama/LixVoiceInteractionService.kt
          cp lix/LixVoiceSessionService.kt build-app/app/src/main/java/com/example/llama/LixVoiceSessionService.kt
          cp lix/LixProjectManager.kt build-app/app/src/main/java/com/example/llama/LixProjectManager.kt
          mkdir -p build-app/app/src/main/res/xml
          cp lix/accessibility_service_config.xml build-app/app/src/main/res/xml/accessibility_service_config.xml
          cp lix/voice_interaction_service.xml build-app/app/src/main/res/xml/voice_interaction_service.xml
          python3 lix/apply_glass_ui.py
          grep -q 'com.google.mlkit:text-recognition' build-app/app/build.gradle.kts || sed -i '/dependencies {/a\    implementation("com.google.mlkit:text-recognition:16.0.1")
          implementation("com.google.mlkit:image-labeling:17.0.9")' build-app/app/build.gradle.kts
          sed -i 's#^set(LLAMA_SRC.*#set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp)#' build-app/lib/src/main/cpp/CMakeLists.txt
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.lix.ai"/' build-app/app/build.gradle.kts
          cp lix/AndroidManifest.xml build-app/app/src/main/AndroidManifest.xml
          sed -i '/defaultConfig {/a\        versionCode = ${{ github.run_number }}\n        versionName = "2.0.${{ github.run_number }}"' build-app/app/build.gradle.kts
          mkdir -p build-app/app/src/main/assets/models build-app/app/src/main/res/drawable
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert lix/lix_icon.svg -resize 512x512 build-app/app/src/main/res/drawable/lix_icon.png
      - name: Download Qwen3
        run: |
          curl -L --fail --retry 5 -o build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf 'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true'
          ls -lh build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf
      - name: Build
        working-directory: build-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare APK artifact
        run: |
          mkdir -p build-app/dist
          APK=$(find build-app/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          cp "$APK" build-app/dist/Lix.apk
          ls -lh build-app/dist/Lix.apk

      - name: Verify final APK size and integrity
        run: |
          test -f build-app/dist/Lix.apk
          echo "Final Lix APK size:"
          ls -lh build-app/dist/Lix.apk
          echo "Final Lix APK SHA-256:"
          sha256sum build-app/dist/Lix.apk

      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: Lix-APK-Build-${{ github.run_number }}
          path: build-app/dist/Lix.apk
          if-no-files-found: error
