name: Lix APK Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: lix-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.31.6'
      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
      - name: Prepare
        run: |
          set -euxo pipefail
          cp -a llama.cpp/examples/llama.android/. build-app
          cp lix/MainActivity.kt build-app/app/src/main/java/com/example/llama/MainActivity.kt
          sed -i 's/\.toDrawable()//g' build-app/app/src/main/java/com/example/llama/MainActivity.kt
          for f in LixAutomation.kt LixAccessibilityService.kt LixWakeService.kt LixTaskService.kt LixVoiceInteractionService.kt LixVoiceSessionService.kt LixProjectManager.kt LixEvolution.kt LixVisualCreator.kt LixFeatureHub.kt LixFeatureRuntime.kt LixMegaModules.kt LixStage1Core.kt LixCapabilityStore.kt LixGodotAgent.kt LixGodotWorkspace.kt LixGodotAssetRuntime.kt LixImageTo3D.kt LixTextTo3D.kt LixBackgroundStore.kt LixBackgroundWorker.kt LixTaskDetailsActivity.kt; do cp "lix/$f" "build-app/app/src/main/java/com/example/llama/$f"; done
          cp lix/evolution_catalog.json build-app/app/src/main/java/com/example/llama/evolution_catalog.json
          mkdir -p build-app/app/src/main/res/xml build-app/app/src/main/assets/models build-app/app/src/main/res/drawable
          cp lix/accessibility_service_config.xml build-app/app/src/main/res/xml/
          cp lix/voice_interaction_service.xml build-app/app/src/main/res/xml/
          python3 lix/apply_glass_ui.py
          python3 lix/mega_features_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-app/app/build.gradle.kts")
          s = p.read_text()
          deps = [
              '    implementation("com.google.mlkit:text-recognition:16.0.1")',
              '    implementation("com.google.mlkit:image-labeling:17.0.9")',
              '    implementation("androidx.work:work-runtime-ktx:2.12.0")'
          ]
          missing = [d for d in deps if d not in s]
          if missing:
              s = s.replace("dependencies {", "dependencies {\n" + "\n".join(missing), 1)
              p.write_text(s)
          PY
          python3 lix/integrate_godot_agent.py
          python3 lix/prepare_build.py
          sed -i 's#^set(LLAMA_SRC.*#set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../../llama.cpp)#' build-app/lib/src/main/cpp/CMakeLists.txt
          sed -i 's/constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;/constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;/' build-app/lib/src/main/cpp/ai_chat.cpp
          sed -i 's/constexpr int   BATCH_SIZE              = 512;/constexpr int   BATCH_SIZE              = 256;/' build-app/lib/src/main/cpp/ai_chat.cpp
          cp lix/AndroidManifest.xml build-app/app/src/main/AndroidManifest.xml
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert lix/lix_icon.svg -resize 512x512 build-app/app/src/main/res/drawable/lix_icon.png
      - name: Download model
        run: curl -L --fail --retry 5 -o build-app/app/src/main/assets/models/lix-qwen3-1.7b-q4_k_m.gguf 'https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true'
      - name: Build APK
        working-directory: build-app
        run: |
          set -euxo pipefail
          chmod +x gradlew
          set -o pipefail
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/lix-gradle.log
      - name: Locate and stage APK
        if: success()
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          find build-app -type f -name '*.apk' -print -exec ls -lh {} \;
          mapfile -t APKS < <(find build-app -type f -name '*.apk' -size +1k 2>/dev/null | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo 'No APK produced by Gradle.'
            find build-app/app/build/outputs -maxdepth 8 -type f -print 2>/dev/null || true
            exit 1
          fi
          APK="${APKS[0]}"
          for candidate in "${APKS[@]}"; do
            if [[ "$candidate" == *debug*.apk ]]; then APK="$candidate"; break; fi
          done
          cp "$APK" dist/Lix.apk
          test -s dist/Lix.apk
          sha256sum dist/Lix.apk
          ls -lh dist/Lix.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lix-debug-${{ github.run_number }}
          path: |
            /tmp/lix-gradle.log
            build-app/app/build/outputs/**/*.apk
          if-no-files-found: warn
          compression-level: 0
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lix-APK-Godot-${{ github.run_number }}
          path: dist/Lix.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
